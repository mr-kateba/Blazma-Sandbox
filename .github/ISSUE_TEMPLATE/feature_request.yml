name: Feature request
description: Suggest an idea or a new detection
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what makes it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
  - type: checkboxes
    id: principles
    attributes:
      label: Project principles
      options:
        - label: This works locally and does not send samples or data off the machine without explicit opt-in.
          required: true
